name: Episodio diario

on:
  schedule:
    # Brasilia = UTC-3. Disparo principal e o cron-job.org (00:30 e 02:30 BRT, job 8840656): o agendador do GitHub
    # nao dispara nesta conta. Estes ficam de reserva. Sai de madrugada para o Spotify ter tempo de puxar ate 06:00.
    - cron: '23 4 * * *'  # 01:23 BRT: reserva
    - cron: '53 5 * * *'  # 02:53 BRT: segunda reserva
  workflow_dispatch: # Rodar na mao: aba Actions > Episodio diario > Run workflow
    inputs:
      automatico:
        description: 'Disparo automatico (cron-job.org): pula se o episodio de hoje ja saiu'
        type: boolean
        default: false
      refazer:
        description: 'Numero do episodio para regravar com as mesmas noticias (vazio = episodio do dia)'
        type: string
        default: ''

permissions:
  contents: write # salvar historico, feed e criar o Release com o MP3

concurrency:
  group: episodio-diario
  cancel-in-progress: false

jobs:
  episodio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg e dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Gerar episodio
        id: ep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTOMATICO: ${{ inputs.automatico }}
          REFAZER: ${{ inputs.refazer }}
        run: python main.py

      - name: Publicar MP3 no Releases
        if: steps.ep.outputs.tag != '' && steps.ep.outputs.refeito != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ep.outputs.tag }}
          ARQUIVO: ${{ steps.ep.outputs.arquivo }}
          TITULO: ${{ steps.ep.outputs.titulo }}
        run: |
          gh release create "$TAG" "$ARQUIVO" --title "$TITULO" \
            --notes "Audio do episodio. Feed: https://mrcluty.github.io/cafe-com-tokens/feed.xml"

      - name: Trocar o MP3 do episodio refeito
        if: steps.ep.outputs.refeito == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ep.outputs.tag }}
          ARQUIVO: ${{ steps.ep.outputs.arquivo }}
        run: gh release upload "$TAG" "$ARQUIVO" --clobber

      - name: Salvar feed e historico
        if: steps.ep.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898689+github-actions[bot]@users.noreply.github.com"
          git add episodios.json historico.json ultimo_episodio.txt docs/feed.xml docs/capas
          git commit -m "episodio ${{ steps.ep.outputs.tag }}"
          git push
